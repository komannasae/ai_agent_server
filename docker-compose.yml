#디비에 맞게 수정
version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pet_travel_db
    environment:
      POSTGRES_DB: pet_travel_db
      POSTGRES_USER: pet_travel_user
      POSTGRES_PASSWORD: pet_travel_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: